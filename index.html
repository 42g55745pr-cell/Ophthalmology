<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --surface2: #faf9f6;
  --border: #e0dfd9;
  --border2: #ece9e3;
  --text: #1a1a1a;
  --text2: #555;
  --text3: #888;
  --text4: #aaa;
  --accent: #111111;
  --accent-hover: #333;
  --danger: #E24B4A;
  --warn: #D97706;
  --ok: #2a7a2a;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.10), 0 3px 8px rgba(0,0,0,.06);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --trans: all .18s cubic-bezier(.4,0,.2,1);
}
body.dark {
  --bg: #1a1a1a;
  --surface: #242424;
  --surface2: #1e1e1e;
  --border: #383838;
  --border2: #2e2e2e;
  --text: #e0dedd;
  --text2: #aaa;
  --text3: #666;
  --text4: #444;
  --accent: #e0dedd;
  --accent-hover: #c0bfbb;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
}
::-webkit-scrollbar{display:none}
*{-ms-overflow-style:none;scrollbar-width:none}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:13px;background:var(--bg);min-height:100vh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
.app{max-width:860px;margin:0 auto;padding:.75rem;padding-top:calc(.75rem + env(safe-area-inset-top));padding-bottom:calc(1.5rem + env(safe-area-inset-bottom));padding-left:calc(.75rem + env(safe-area-inset-left));padding-right:calc(.75rem + env(safe-area-inset-right))}
h1{font-size:17px;font-weight:700;margin-bottom:.75rem;color:var(--text);letter-spacing:-.3px}
.top-tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1.5px solid var(--border);margin-bottom:.75rem;position:sticky;top:0;z-index:50;background:var(--bg);padding-top:env(safe-area-inset-top);transition:background .2s}
.top-tabs::-webkit-scrollbar{display:none}
body.dark .top-tabs{background:#1a1a1a}
.ttab{padding:8px 11px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--text3);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap;flex-shrink:0;transition:var(--trans)}
.ttab:active{opacity:.7}
.ttab.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.sec{display:none}.sec.on{display:block}
.srch{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:13px;background:var(--surface);color:var(--text);margin-bottom:.5rem;outline:none;transition:var(--trans)}
.srch:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(17,17,17,.08)}
body.dark .srch:focus{box-shadow:0 0 0 3px rgba(224,222,221,.1)}
.srch:focus{border-color:var(--text3)}
.frow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.75rem}
.fb{padding:4px 11px;font-size:11px;border:1px solid var(--border);border-radius:20px;background:var(--surface);cursor:pointer;color:var(--text3)}
.fb.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.dc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-sm);border-left:3px solid transparent}
.dc[data-cat="망막"]{border-left-color:#3B82F6}
.dc[data-cat="전안부"]{border-left-color:#10B981}
.dc[data-cat="각막"]{border-left-color:#06B6D4}
.dc[data-cat="신경"]{border-left-color:#8B5CF6}
.dc[data-cat="녹내장"]{border-left-color:#F59E0B}
.dc[data-cat="성형"]{border-left-color:#EC4899}
.dc[data-cat="포도막"]{border-left-color:#EF4444}
.dc[data-cat="소아"]{border-left-color:#F97316}
.dc[data-cat="수정체"]{border-left-color:#84CC16}
.dc[data-cat="외상"]{border-left-color:#DC2626}
.dc[data-cat="안와"]{border-left-color:#7C3AED}
.dc[data-cat="누도"]{border-left-color:#0EA5E9}
.dc-hd{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer;user-select:none;transition:background .15s}
.dc-hd:hover{background:var(--surface2)}
.dc-hd:active{background:var(--border2)}
.dc-title{font-size:13px;font-weight:500}
.itabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface2)}
.it{padding:6px 12px;font-size:11px;cursor:pointer;border:none;background:none;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.it.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.pn{display:none;padding:10px 14px}.pn.on{display:block}
.bd{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.teal{background:#E1F5EE;color:#085041}.coral{background:#FAECE7;color:#712B13}
.amber{background:#FAEEDA;color:#633806}.blue{background:#E6F1FB;color:#0C447C}
.gray{background:#F1EFE8;color:#444}.purple{background:#EEEDFE;color:#3C3489}
.pink{background:#FBEAF0;color:#72243E}.green{background:#EAF3DE;color:#27500A}
.red{background:#FCEBEB;color:#791F1F}.orange{background:#FEF0E6;color:#7A3200}
.indigo{background:#ECEEFE;color:#3730A3}.rose{background:#FFF0F3;color:#7C1D36}
.li{display:flex;gap:7px;margin-bottom:5px;font-size:12.5px;line-height:1.65}
.li-n{color:var(--text3);flex-shrink:0;font-size:11px;min-width:14px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pill{font-size:11px;padding:2px 9px;background:var(--surface2);border-radius:20px;color:var(--text2)}
.hb{border-radius:7px;padding:8px 12px;font-size:12px;line-height:1.7;margin-bottom:5px}
.hb-r{background:#FCEBEB;border-left:3px solid #E24B4A}
.hb-a{background:#FAEEDA;border-left:3px solid #EF9F27}
.hb-t{background:#E1F5EE;border-left:3px solid #1D9E75}
.hb-g{background:#F1EFE8;border-left:3px solid #888}
.hb-b{background:#E6F1FB;border-left:3px solid #378ADD}
.kc-hd{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #eee;margin-top:10px}
.kc-hd:first-child{margin-top:0}
.kc-hd.r{color:#A32D2D;border-color:#F09595}.kc-hd.a{color:#633806;border-color:#FAC775}.kc-hd.t{color:#085041;border-color:#5DCAA5}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dot-r{background:#E24B4A}.dot-a{background:#EF9F27}.dot-t{background:#1D9E75}
.fu-r{display:grid;grid-template-columns:120px 1fr;gap:4px;margin-bottom:4px;font-size:12px}
.fu-t{color:var(--text3);font-size:11px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);transition:var(--trans)}
.card h4{font-size:12px;font-weight:600;margin-bottom:8px}
.stat-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:.75rem}
.stat-chip{font-size:11px;padding:3px 10px;background:var(--surface2);border-radius:20px;color:var(--text3);border:1px solid var(--border);cursor:default;transition:var(--trans)}
.stat-chip span{color:var(--text);font-weight:700}
.stat-chip span{font-weight:700;color:var(--text)}
/* 분류 테이블 */
.cls-tbl{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.cls-tbl th{padding:5px 8px;text-align:left;font-weight:600;border:1px solid var(--border);font-size:11px}
.cls-tbl td{padding:5px 8px;border:1px solid var(--border);line-height:1.5;vertical-align:top}
.cls-tbl tr:nth-child(even) td{background:var(--surface2)}
.th-zone{background:#E6F1FB;color:#0C447C}
.th-stage{background:#EAF3DE;color:#27500A}
.th-type{background:#FAEEDA;color:#633806}
.th-tx{background:#FCEBEB;color:#791F1F}
/* IVI */
.ivi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ivi-hd{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;justify-content:space-between;align-items:flex-start}
.ivi-name{font-size:13px;font-weight:700}
.ivi-sub{font-size:11px;color:var(--text3);margin-top:1px}
.ivi-body{padding:11px 14px}
.ivi-row{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:12px;margin-bottom:4px;align-items:baseline}
.ivi-lbl{color:var(--text3);font-size:11px;font-weight:500}
.ivi-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:3px;margin-right:2px;font-weight:500}
.tag-b{background:#E6F1FB;color:#0C447C}.tag-t{background:#EAF3DE;color:#27500A}
.tag-g{background:#F1EFE8;color:#444}.tag-p{background:#EEEDFE;color:#3C3489}
.tag-a{background:#FAEEDA;color:#633806}.tag-r{background:#FCEBEB;color:#791F1F}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.dx-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.dx-hd{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}

<script>
/* ── 글로벌 스와이프 매니저 ── */
(function(){
  var tx=0, ty=0;

  var touchTarget = null;
  document.addEventListener('touchstart', function(e){
    if(e.touches.length!==1) return;
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    touchTarget = e.target;
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    // 가로 이동이 40px 이상 & 가로가 세로보다 클 때만
    if(Math.abs(dx) < 40 || Math.abs(dy) >= Math.abs(dx)) return;

    var sec = document.querySelector('.sec.on');
    if(!sec) return;
    var sid = sec.id;

    // ── 진료탭: 터치한 카드 내 탭 스와이프 ──
    if(sid === 'sec-proto'){
      // touchTarget이 속한 열린 db_ 카드 찾기
      var db = touchTarget ? touchTarget.closest('[id^="db_"]') : null;
      if(!db || db.style.display !== 'block') return;
      var cid = parseInt(db.id.replace('db_',''));
      if(isNaN(cid)) return;
      var cur = 0;
      for(var j=0; j<6; j++){
        var pn = document.getElementById('pn'+cid+'_'+j);
        if(pn && pn.classList.contains('on')){ cur=j; break; }
      }
      if(dx < 0 && cur < 5) swTab(cid, cur+1);
      else if(dx > 0 && cur > 0) swTab(cid, cur-1);
      return;
    }

    // ── 즐겨찾기탭: 터치한 카드 내 탭 스와이프 ──
    if(sid === 'sec-favtab'){
      var dbf = touchTarget ? touchTarget.closest('[id^="db_fav_"]') : null;
      if(!dbf || dbf.style.display !== 'block') return;
      var fid = parseInt(dbf.id.replace('db_fav_',''));
      if(isNaN(fid)) return;
      var fcur = 0;
      for(var j=0; j<6; j++){
        var pn = document.getElementById('pnfav'+fid+'_'+j);
        if(pn && pn.classList.contains('on')){ fcur=j; break; }
      }
      if(dx < 0 && fcur < 5) swFavTab(fid, fcur+1);
      else if(dx > 0 && fcur > 0) swFavTab(fid, fcur-1);
      return;
    }

    // ── 처방약탭: 카테고리 전환 ──
    if(sid === 'sec-drugs'){
      var sks = window.subKeys;
      var cdk = window.getCurDrugKey ? window.getCurDrugKey() : null;
      if(!sks || !cdk) return;
      var di = sks.indexOf(cdk);
      var target = dx < 0
        ? sks[di+1] || sks[0]
        : sks[di-1] || sks[sks.length-1];
      if(target === cdk) return;
      var tb = document.querySelector('.drug-stab[data-k="'+target+'"]');
      if(tb) window.switchDrugTab(target, tb);
      return;
    }

    // ── IVI탭: 서브탭 전환 ──
    if(sid === 'sec-ivi'){
      var ord = ['drug','dx','ins2','proc','calc'];
      if(typeof curIviSub==='undefined') return;
      var ii = ord.indexOf(curIviSub);
      var ni = dx < 0 ? Math.min(ii+1, ord.length-1) : Math.max(ii-1, 0);
      if(ni === ii) return;
      var ib = document.querySelector('#ivi-tabs .fb:nth-child('+(ni+1)+')');
      if(ib) iviTab(ord[ni], ib);
      return;
    }

  }, {passive:true});
})();

/* ── 검색 히스토리 ── */
var searchHistory = [];
try {
  var _sh = localStorage.getItem('oph_srch_hist');
  if(_sh) searchHistory = JSON.parse(_sh);
} catch(e){}

function saveSearchHistory(q){
  if(!q || q.length < 2) return;
  searchHistory = searchHistory.filter(function(x){ return x !== q; });
  searchHistory.unshift(q);
  if(searchHistory.length > 5) searchHistory.length = 5;
  try { localStorage.setItem('oph_srch_hist', JSON.stringify(searchHistory)); } catch(e){}
}

function showSearchHistory(){
  if(!searchHistory.length) return;
  var el = document.getElementById('srch');
  if(!el || el.value) return;
  if(document.getElementById('srch-history-dd')) return;

/* ── 순수 JS SHA-256 (crypto.subtle 없이 동작) ── */
function sha256(str){
  function rightRotate(value,amount){return(value>>>amount)|(value<<(32-amount));}
  var mathPow=Math.pow;
  var maxWord=mathPow(2,32);
  var lengthProperty='length';
  var i,j,result='';
  var words=[];
  var asciiBitLength=str[lengthProperty]*8;
  var hash=sha256.h=sha256.h||[];
  var k=sha256.k=sha256.k||[];
  var primeCounter=k[lengthProperty];
  var isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=parseInt(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=parseInt(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  str+='';
  while(str[lengthProperty]%64-56)str+='␀';
  for(i=0;i<str[lengthProperty];i++){
    j=str.charCodeAt(i);
    if(j>>8)return '';
    words[i>>2]|=j<<((3-i)%4*8);
  }
  words[words[lengthProperty]]=((asciiBitLength/maxWord)|0);
  words[words[lengthProperty]]=asciiBitLength;
  for(j=0;j<words[lengthProperty];){
    var w=words.slice(j,j+=16);
    var oldHash=hash.slice(0);
    for(i=0;i<64;i++){
      var i2=i<16?w[i]:(
        rightRotate(w[i-2],17)^rightRotate(w[i-2],19)^(w[i-2]>>>10))+w[i-7]+(
        rightRotate(w[i-15],7)^rightRotate(w[i-15],18)^(w[i-15]>>>3))+w[i-16];
      w[i]=i2=i2|0;
      var temp1=hash[7]+(rightRotate(hash[4],6)^rightRotate(hash[4],11)^rightRotate(hash[4],25))+(hash[4]&hash[5]^~hash[4]&hash[6])+k[i]+i2;
      var temp2=(rightRotate(hash[0],2)^rightRotate(hash[0],13)^rightRotate(hash[0],22))+(hash[0]&hash[1]^hash[0]&hash[2]^hash[1]&hash[2]);
      hash=[temp1+temp2|0].concat(hash);
      hash[4]=hash[4]+temp1|0;
      hash.length=8;
    }
    for(i=0;i<8;i++)hash[i]=hash[i]+oldHash[i]|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?'0':'')+b.toString(16);}
  return result;
}

function tgDx(i){
  const b=document.getElementById('db_dx'+i),c=document.getElementById('dc'+i);
  const o=b.style.display==='block';
  b.style.display=o?'none':'block';
  if(c)c.textContent=o?'▼':'▲';
}

const cats=[...new Set(D.map(d=>d.cat))];
let actCat='전체';

function updateFavBadge(){
  const badge=document.getElementById('fav-badge');
  if(!badge) return;
  if(favs.size>0){badge.textContent=favs.size;badge.style.display='inline';}
  else{badge.style.display='none';}
}
function goFavTab(){
  const btn=document.getElementById('fav-tab-btn');
  if(btn) goTab('favtab',btn);
}
function buildStat(){
  const fc=favs.size;
  const favChip=fc>0?'<div class="stat-chip" style="cursor:pointer;background:#FAEEDA;color:#633806" onclick="goFavTab()">★ 즐겨찾기 <span style="color:#633806;font-weight:700">'+fc+'개</span></div>':'';
  const recentChip=recentViewed.length>0?'<div class="stat-chip" style="cursor:pointer" onclick="showRecent(this)" title="최근 본 질환">🕐 최근</div>':'';
  document.getElementById('stat-row').innerHTML=
    '<div class="stat-chip">총 <span>'+D.length+'개</span> 질환</div>'+
    '<div class="stat-chip">카테고리 <span>'+cats.length+'개</span></div>'+
    '<div class="stat-chip">IVI 약물 <span>'+DRUGS.length+'종</span></div>'+
    favChip+recentChip;
}
function buildFilters(){
  const catCount={};
  D.forEach(d=>{catCount[d.cat]=(catCount[d.cat]||0)+1;});
  document.getElementById('frow').innerHTML=['전체',...cats].map(c=>{
    const cnt=c==='전체'?D.length:(catCount[c]||0);
    return '<button class="fb'+(c==='전체'?' on':'')+'" onclick="setF(this.dataset.cat,this)" data-cat="'+c+'">'+c+' <span style="font-size:10px;opacity:.7">'+cnt+'</span></button>';
  }).join('');
}
function setF(c,btn){
  actCat=c;
  document.querySelectorAll('#frow .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  try{localStorage.setItem('oph_last_cat',c);}catch(e){}
  render();
}
function swTab(cid,ti){
  cardTabState[cid]=ti;
  for(let j=0;j<6;j++){
    var _it=document.getElementById('it'+cid+'_'+j);if(_it)_it.classList.toggle('on',j===ti);
    var _pn=document.getElementById('pn'+cid+'_'+j);if(_pn)_pn.classList.toggle('on',j===ti);
  }
}
function toggleCard(id){
  const b=document.getElementById('db_'+id),c=document.getElementById('chev_'+id);
  if(!b)return;
  const open=b.style.display==='block';
  b.style.display=open?'none':'block';
  if(c){c.style.transform=open?'':'rotate(90deg)';}
  // 열린 카드 shadow 강화
  const dc=b.closest('.dc')||b.parentElement;
  if(dc) dc.style.boxShadow=open?'var(--shadow-sm)':'var(--shadow-md)';
  if(c)c.textContent=open?'▼':'▲';
  // 최근 본 질환 기록 (숫자 인덱스인 경우만)
  if(!open&&!isNaN(id)&&D[parseInt(id)]){addRecent(D[parseInt(id)].name);}
}

function copyDrugs(idx){
  const d=D[idx];
  if(!d)return;
  const text=`[${d.name}] 처방약\n`+d.drugs.map(dr=>`• ${dr}`).join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>{
    // 토스트 표시
    const toast=document.createElement('div');
    toast.style.cssText='position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 18px;border-radius:16px;font-size:12px;z-index:9999;pointer-events:none';
    toast.textContent='📋 처방약 복사됨';
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),1500);
  }).catch(()=>{});
  }
}

function doIVICalc2(){
  const lastDate=document.getElementById('ivi-last-date2').value;
  const days=parseInt(document.getElementById('ivi-drug-sel2').value);
  const result=document.getElementById('ivi-calc-result2');
  if(!lastDate){result.innerHTML='<span style="color:#E24B4A">날짜를 입력하세요</span>';return;}
  const last=new Date(lastDate);
  const next=new Date(last.getTime()+days*24*60*60*1000);
  const today=new Date();
  today.setHours(0,0,0,0);
  const fmt=d=>`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  const diffDays=Math.round((next-today)/(24*60*60*1000));
  const status=diffDays<0
    ? `<span style="color:#E24B4A;font-weight:700">⚠ ${Math.abs(diffDays)}일 경과 (주사 가능)</span>`
    : diffDays===0
    ? `<span style="color:#2a7a2a;font-weight:700">✅ 오늘 주사 가능</span>`
    : `<span style="color:#555">D-${diffDays} (${diffDays}일 후)</span>`;
  const calcText='다음 주사 가능일: '+fmt(next)+'\n마지막 주사: '+fmt(last)+' (+'+days+'일)';
  result.dataset.calcText=calcText;
  result.innerHTML=
    '<div style="font-size:15px;font-weight:700;color:#111">다음 주사 가능일: '+fmt(next)+'</div>'+
    '<div>'+status+'</div>'+
    '<div style="font-size:11px;color:#888;margin-top:4px">마지막 주사: '+fmt(last)+' (+'+days+'일)</div>';
  const saveBtn=document.getElementById('ivi-save-btn');
  if(saveBtn) saveBtn.style.display='block';
}

/* ── 즐겨찾기 탭 ── */
function renderFavTab(){
  const el=document.getElementById('sec-favtab');
  if(!el)return;
  const favDiseases=D.filter(d=>favs.has(d.name));
  if(!favDiseases.length){
    el.innerHTML='<div class="empty" style="padding:3rem 1rem;text-align:center"><div style="font-size:3rem;margin-bottom:1rem;opacity:.5">⭐</div><div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:.5rem">즐겨찾기가 없어요</div><div style="font-size:12px;color:var(--text4);line-height:1.7">질환 카드의 ★ 버튼을 눌러<br>자주 보는 질환을 추가하세요</div></div>';
    return;
  }
  const cardHtmlArr=[];
  const cards=favDiseases.map(d=>{
    const i=D.indexOf(d);
    const bc=catColor[d.cat]||'gray';
    const fuHtml=d.fu.map(([t,v])=>`<div class="fu-r"><span class="fu-t">${t}</span><span>${v}</span></div>`).join('');
    const kcHtml=`<div class="kc-hd r">놓치면 안 되는 소견</div>${d.kc.r.map(x=>`<div class="li"><div class="dot dot-r"></div><div>${x}</div></div>`).join('')}<div class="kc-hd a">처방/치료 결정 기준</div>${d.kc.a.map(x=>`<div class="li"><div class="dot dot-a"></div><div>${x}</div></div>`).join('')}<div class="kc-hd t">환자 설명 포인트</div>${d.kc.t.map(x=>`<div class="li"><div class="dot dot-t"></div><div>${x}</div></div>`).join('')}`;
    const isROP=d.extraHTML==='rop';
    const slitExtra=isROP?ropClassTable:'';
    const fuExtra=isROP?ropFUTable:'';
    return `<div class="dc">
      <div class="dc-hd" onclick="toggleCard('fav_'+${i})">
        <div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0">
          <button class="fav-btn on" onclick="event.stopPropagation();toggleFavIdx(${i},this)" title="즐겨찾기 해제">★</button>
          <span class="dc-title">${d.name}</span>
        </div>
        <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">
          <span class="bd ${bc}">${d.cat}</span>
          <span id="chev_fav_${i}" style="font-size:10px;color:#888">▼</span>
        </div>
      </div>
      <div id="db_fav_${i}" style="display:none;border-top:1px solid #e0dfd9">
        <div class="itabs">
          <button class="it on" id="itfav${i}_0" onclick="swFavTab(${i},0)">주호소</button>
          <button class="it" id="itfav${i}_1" onclick="swFavTab(${i},1)">슬릿</button>
          <button class="it" id="itfav${i}_2" onclick="swFavTab(${i},2)">검사</button>
          <button class="it" id="itfav${i}_3" onclick="swFavTab(${i},3)">처방약</button>
          <button class="it" id="itfav${i}_4" onclick="swFavTab(${i},4)">추적관찰</button>
          <button class="it" id="itfav${i}_5" onclick="swFavTab(${i},5)">★ 핵심체크</button>
        </div>
        <div class="pn on" id="pnfav${i}_0">${d.cc&&d.cc.length?d.cc.map((s,j)=>`<div class="li"><span class="li-n" style="color:#E24B4A;font-weight:700">${j+1}.</span><span>${s}</span></div>`).join(''):'<div class="empty" style="padding:1rem">주호소 데이터 없음</div>'}</div>
        <div class="pn" id="pnfav${i}_1">${d.slit.map((s,j)=>`<div class="li"><span class="li-n">${j+1}.</span><span>${s}</span></div>`).join('')}${slitExtra}</div>
        <div class="pn" id="pnfav${i}_2"><div class="pills">${d.exam.map(e=>`<span class="pill">${e}</span>`).join('')}</div></div>
        <div class="pn" id="pnfav${i}_3">${d.drugs.map(dr=>`<div class="li"><span class="li-n">•</span><span>${dr}</span></div>`).join('')}</div>
        <div class="pn" id="pnfav${i}_4">${fuExtra}${fuHtml}${d.note?`<div class="hb hb-g" style="margin-top:8px;font-size:11px">📚 ${d.note}</div>`:''}</div>
        <div class="pn" id="pnfav${i}_5">${kcHtml}</div>
      </div>
    </div>`;
  }).map(function(c){cardHtmlArr.push(c);return c;}).join('');
  const favGrouped=(function(){var _fg=document.getElementById('fav-group-btn');return _fg&&_fg.dataset.grouped==='1';})();
  const displayCards=favGrouped
    ? Object.entries(favDiseases.reduce((acc,d)=>{(acc[d.cat]=acc[d.cat]||[]).push(d);return acc},{}))
        .map(function(entry){
          var cat=entry[0], ds=entry[1];
          return '<div style="font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px">'+cat+'</div>'+
            ds.map(function(d){var ci=favDiseases.indexOf(d);return ci>-1?cardHtmlArr[ci]:'';}).join('');
        }).join('')
    : cards;
  el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
    <div class="stat-chip">★ 즐겨찾기 <span style="color:#111;font-weight:700">${favDiseases.length}개</span></div>
    <div style="display:flex;gap:6px">
      <button id="fav-group-btn" data-grouped="0" onclick="toggleFavGroup(this)" style="font-size:11px;padding:3px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;color:#888">카테고리별</button>
      <button onclick="clearAllFavs()" style="font-size:11px;padding:3px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;color:#888">전체 해제</button>
    </div>
  </div>`+displayCards;
}
  // 즐겨찾기 스와이프 → 글로벌 매니저 처리

function toggleFavGroup(btn){
  const grouped=btn.dataset.grouped==='1';
  btn.dataset.grouped=grouped?'0':'1';
  btn.style.background=grouped?'#fff':'#111';
  btn.style.color=grouped?'#888':'#fff';
  renderFavTab();
}

function swFavTab(ci,ti){
  cardTabState['f'+ci]=ti;
  for(let j=0;j<6;j++){
    var _if=document.getElementById('itfav'+ci+'_'+j);if(_if)_if.classList.toggle('on',j===ti);
    var _pf=document.getElementById('pnfav'+ci+'_'+j);if(_pf)_pf.classList.toggle('on',j===ti);
  }
}
function clearAllFavs(){
  favs.clear(); saveFavs(); buildStat();
  // 진료탭 모든 fav-btn 초기화
  document.querySelectorAll('[id^="fav-btn-"]').forEach(b=>{
    b.classList.remove('on');
    b.textContent='☆';
  });
  renderFavTab();
}

  document.getElementById('pw-cur').value='';

  document.getElementById('pw-new2').value='';
  document.getElementById('pw-hint-input').value=localStorage.getItem('oph_pw_hint')||'';
  document.getElementById('pw-change-err').textContent='';
  document.getElementById('pw-change-modal').classList.add('on');
}

function doChangePw(){
  var cur=document.getElementById('pw-cur').value;
  var np=document.getElementById('pw-new').value;
  var np2=document.getElementById('pw-new2').value;
  var err=document.getElementById('pw-change-err');
  if(!cur){err.textContent='현재 비밀번호를 입력하세요';return;}
  if(!np||np.length<4){err.textContent='새 비밀번호는 4자 이상이어야 합니다';return;}
  if(np!==np2){err.textContent='새 비밀번호가 일치하지 않습니다';return;}
  var saved=localStorage.getItem('oph_pw')||'1602';
  if(cur!==saved){err.textContent='현재 비밀번호가 틀렸습니다';return;}
  localStorage.setItem('oph_pw',np);
  // 힌트 저장
  const hint=document.getElementById('pw-hint-input').value.trim();
  if(hint) localStorage.setItem('oph_pw_hint',hint);
  else localStorage.removeItem('oph_pw_hint');
  
  document.getElementById('pw-change-modal').classList.remove('on');
  err.textContent='';
  
  // 성공 알림 (모달 방식)
  setTimeout(()=>{
    const toast=document.createElement('div');
    toast.style.cssText='position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;';
    toast.textContent='✅ 비밀번호가 변경되었습니다';
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),2500);
  },200);
}

function checkPw(){
  var input=document.getElementById('pw-input').value;
  var err=document.getElementById('pw-err');
  if(!input){err.textContent='비밀번호를 입력하세요';return;}
  var saved=localStorage.getItem('oph_pw')||'1602';
  if(input===saved){
    document.getElementById('lock-screen').style.display='none';
    err.textContent='';
  } else {
    err.textContent='비밀번호가 틀렸습니다';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
  }
}

<script>
// Service Worker 등록 (HTTPS 환경에서만)
if('serviceWorker' in navigator && location.protocol === 'https:'){
  var SW_CODE = `
const CACHE = 'ophthal-v14';
self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE).then(cache => cache.add(self.location.href))
  );
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    )
  );
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  e.respondWith(
    caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
      if(res && res.status === 200){
        var clone = res.clone();
        caches.open(CACHE).then(cache => cache.put(e.request, clone));
      }
      return res;
    }).catch(() => caches.match(e.request)))
  );
});
`;
  var blob = new Blob([SW_CODE], {type:'application/javascript'});
  var swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).then(function(reg){
    console.log('SW registered');
  }).catch(function(e){
    console.log('SW failed:', e);
  });
}
</script>
