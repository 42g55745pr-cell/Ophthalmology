<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;font-size:13px;background:#f5f4f0;min-height:100vh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.app{max-width:860px;margin:0 auto;padding:.75rem;padding-top:calc(.75rem + env(safe-area-inset-top));padding-bottom:calc(1.5rem + env(safe-area-inset-bottom));padding-left:calc(.75rem + env(safe-area-inset-left));padding-right:calc(.75rem + env(safe-area-inset-right))}
h1{font-size:16px;font-weight:700;margin-bottom:.75rem;color:#111}
.top-tabs{display:flex;flex-wrap:wrap;border-bottom:1.5px solid #ddd;margin-bottom:.75rem;position:sticky;top:0;z-index:50;background:#f5f4f0;padding-top:env(safe-area-inset-top)}
body.dark .top-tabs{background:#1a1a1a}
.ttab{padding:7px 12px;font-size:12px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.ttab.on{color:#111;border-bottom-color:#111;font-weight:600}
.sec{display:none}.sec.on{display:block}
.srch{width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:8px;font-size:12px;background:#fff;color:#111;margin-bottom:.5rem;outline:none}
.srch:focus{border-color:#888}
.frow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.75rem}
.fb{padding:4px 11px;font-size:11px;border:1px solid #ccc;border-radius:20px;background:#fff;cursor:pointer;color:#666}
.fb.on{background:#111;color:#fff;border-color:#111}
.dc{background:#fff;border:1px solid #e0dfd9;border-radius:10px;margin-bottom:7px;overflow:hidden}
.dc-hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;user-select:none}
.dc-hd:hover{background:#faf9f6}
.dc-title{font-size:13px;font-weight:500}
.itabs{display:flex;overflow-x:auto;border-bottom:1px solid #e0dfd9;background:#faf9f6}
.it{padding:6px 12px;font-size:11px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.it.on{color:#111;border-bottom-color:#111;font-weight:600}
.pn{display:none;padding:10px 14px}.pn.on{display:block}
.bd{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.teal{background:#E1F5EE;color:#085041}.coral{background:#FAECE7;color:#712B13}
.amber{background:#FAEEDA;color:#633806}.blue{background:#E6F1FB;color:#0C447C}
.gray{background:#F1EFE8;color:#444}.purple{background:#EEEDFE;color:#3C3489}
.pink{background:#FBEAF0;color:#72243E}.green{background:#EAF3DE;color:#27500A}
.red{background:#FCEBEB;color:#791F1F}.orange{background:#FEF0E6;color:#7A3200}
.indigo{background:#ECEEFE;color:#3730A3}.rose{background:#FFF0F3;color:#7C1D36}
.li{display:flex;gap:7px;margin-bottom:4px;font-size:12px;line-height:1.6}
.li-n{color:#888;flex-shrink:0;font-size:11px;min-width:14px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pill{font-size:11px;padding:2px 9px;background:#f0ede8;border-radius:20px;color:#555}
.hb{border-radius:7px;padding:8px 12px;font-size:12px;line-height:1.7;margin-bottom:5px}
.hb-r{background:#FCEBEB;border-left:3px solid #E24B4A}
.hb-a{background:#FAEEDA;border-left:3px solid #EF9F27}
.hb-t{background:#E1F5EE;border-left:3px solid #1D9E75}
.hb-g{background:#F1EFE8;border-left:3px solid #888}
.hb-b{background:#E6F1FB;border-left:3px solid #378ADD}
.kc-hd{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #eee;margin-top:10px}
.kc-hd:first-child{margin-top:0}
.kc-hd.r{color:#A32D2D;border-color:#F09595}.kc-hd.a{color:#633806;border-color:#FAC775}.kc-hd.t{color:#085041;border-color:#5DCAA5}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dot-r{background:#E24B4A}.dot-a{background:#EF9F27}.dot-t{background:#1D9E75}
.fu-r{display:grid;grid-template-columns:120px 1fr;gap:4px;margin-bottom:4px;font-size:12px}
.fu-t{color:#888;font-size:11px;font-weight:500}
.card{background:#fff;border:1px solid #e0dfd9;border-radius:10px;padding:12px 14px;margin-bottom:9px}
.card h4{font-size:12px;font-weight:600;margin-bottom:8px}
.stat-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:.75rem}
.stat-chip{font-size:11px;padding:3px 10px;background:#f0ede8;border-radius:20px;color:#666}
.stat-chip span{font-weight:700;color:#111}
/* 분류 테이블 */
.cls-tbl{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.cls-tbl th{padding:5px 8px;text-align:left;font-weight:600;border:1px solid #e0dfd9;font-size:11px}
.cls-tbl td{padding:5px 8px;border:1px solid #e0dfd9;line-height:1.5;vertical-align:top}
.cls-tbl tr:nth-child(even) td{background:#faf9f6}
.th-zone{background:#E6F1FB;color:#0C447C}
.th-stage{background:#EAF3DE;color:#27500A}
.th-type{background:#FAEEDA;color:#633806}
.th-tx{background:#FCEBEB;color:#791F1F}
/* IVI */
.ivi-card{background:#fff;border:1px solid #e0dfd9;border-radius:10px;margin-bottom:10px;overflow:hidden}
.ivi-hd{padding:11px 14px;border-bottom:1px solid #e0dfd9;background:#faf9f6;display:flex;justify-content:space-between;align-items:flex-start}
.ivi-name{font-size:13px;font-weight:700}
.ivi-sub{font-size:11px;color:#888;margin-top:1px}
.ivi-body{padding:11px 14px}
.ivi-row{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:12px;margin-bottom:4px;align-items:baseline}
.ivi-lbl{color:#888;font-size:11px;font-weight:500}
.ivi-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:3px;margin-right:2px;font-weight:500}
.tag-b{background:#E6F1FB;color:#0C447C}.tag-t{background:#EAF3DE;color:#27500A}
.tag-g{background:#F1EFE8;color:#444}.tag-p{background:#EEEDFE;color:#3C3489}
.tag-a{background:#FAEEDA;color:#633806}.tag-r{background:#FCEBEB;color:#791F1F}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.dx-card{background:#fff;border:1px solid #e0dfd9;border-radius:10px;margin-bottom:8px;overflow:hidden}
.dx-hd{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.dx-hd:hover{background:#faf9f6}
.ins-t{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:8px}
.ins-t th{padding:6px 10px;text-align:left;font-weight:600;border:1px solid #e0dfd9;font-size:11px}
.ins-t td{padding:6px 10px;border:1px solid #e0dfd9;vertical-align:top;line-height:1.5}
.ins-t tr:nth-child(even) td{background:#faf9f6}
.th1{background:#E6F1FB;color:#0C447C}.th2{background:#EAF3DE;color:#27500A}
.th3{background:#FAEEDA;color:#633806}.th4{background:#F1EFE8;color:#444}
.proc-step{display:flex;gap:9px;margin-bottom:7px;align-items:flex-start}
.proc-n{width:22px;height:22px;border-radius:50%;background:#111;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sl{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.sl:first-child{margin-top:0}
.add-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#333;font-size:12px;cursor:pointer;margin-bottom:.75rem}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:min(520px,95vw);box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:.85rem}
.fg{margin-bottom:9px}.fg label{display:block;font-size:11px;color:#888;margin-bottom:3px}
.fg input,.fg textarea{width:100%;padding:7px 11px;border:1px solid #ccc;border-radius:8px;font-size:12px;background:#fff;color:#111;font-family:inherit;outline:none}
.fg input:focus,.fg textarea:focus{border-color:#888}
.fg textarea{resize:vertical;min-height:80px}
.mfoot{display:flex;gap:8px;margin-top:.85rem;justify-content:flex-end}
.btn-p{padding:7px 16px;background:#111;color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:500}
.btn-s{padding:7px 16px;background:#fff;border:1px solid #ccc;border-radius:8px;font-size:12px;cursor:pointer;color:#333}
.empty{text-align:center;padding:2.5rem;color:#888;font-size:12px}
/* 비밀번호 잠금 */
#lock-screen{
  position:fixed;inset:0;z-index:9999;
  background:#f5f4f0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2rem;
}
body.dark #lock-screen{background:#1a1a1a}
#lock-screen .lock-icon{font-size:3rem;margin-bottom:1.5rem}
#lock-screen h2{font-size:18px;font-weight:700;margin-bottom:.5rem;color:#111}
body.dark #lock-screen h2{color:#e0dedd}
#lock-screen p{font-size:12px;color:#888;margin-bottom:1.5rem}
#lock-screen input{
  width:100%;max-width:280px;
  padding:12px 16px;
  border:1.5px solid #ccc;border-radius:12px;
  font-size:16px;text-align:center;
  letter-spacing:.3em;
  background:#fff;color:#111;
  outline:none;margin-bottom:.75rem;
  -webkit-text-security:disc;
}
body.dark #lock-screen input{background:#242424;border-color:#444;color:#e0dedd}
#lock-screen input:focus{border-color:#111}
body.dark #lock-screen input:focus{border-color:#e0dedd}
#lock-screen button{
  width:100%;max-width:280px;
  padding:12px;border-radius:12px;
  background:#111;color:#fff;
  border:none;font-size:14px;font-weight:600;
  cursor:pointer;
}
body.dark #lock-screen button{background:#e0dedd;color:#111}
#lock-screen .err{
  font-size:12px;color:#E24B4A;
  margin-top:.5rem;min-height:18px;
}
#lock-screen .hint{
  font-size:11px;color:#aaa;
  margin-top:1.5rem;text-align:center;
}

.fav-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:0 3px;opacity:.3;transition:opacity .15s;line-height:1;flex-shrink:0}
.fav-btn.on{opacity:1}
body.dark{background:#1a1a1a;color:#e0dedd}
body.dark .dc,body.dark .card,body.dark .ivi-card,body.dark .dx-card{background:#242424;border-color:#383838}
body.dark .dc-hd:hover,body.dark .dx-hd:hover{background:#2a2a2a}
body.dark .itabs,body.dark .ivi-hd{background:#1e1e1e}
body.dark .pill{background:#2e2e2e;color:#aaa}
body.dark .srch,.dark input,.dark textarea{background:#2a2a2a;border-color:#444;color:#e0dedd}
body.dark .fb{background:#2a2a2a;border-color:#444;color:#aaa}
body.dark .fb.on{background:#e0dedd;color:#111;border-color:#e0dedd}
body.dark .ttab{color:#777}
body.dark .ttab.on{color:#e0dedd;border-bottom-color:#e0dedd}
body.dark .stat-chip{background:#2a2a2a;color:#888}
body.dark .stat-chip span{color:#e0dedd}
body.dark .ins-t td,.dark .cls-tbl td{border-color:#383838}
body.dark .ins-t tr:nth-child(even) td,.dark .cls-tbl tr:nth-child(even) td{background:#1e1e1e}
body.dark .hb-r{background:#2d1515}body.dark .hb-a{background:#2d2010}
body.dark .hb-t{background:#0d2a1a}body.dark .hb-g{background:#222}
body.dark .hb-b{background:#0d1f2d}
body.dark .add-btn,.dark .btn-s{background:#2a2a2a;border-color:#444;color:#ccc}
body.dark .proc-n{background:#e0dedd;color:#111}
body.dark .modal{background:#222;border-color:#444}
body.dark .fg input,.dark .fg textarea{background:#2a2a2a;border-color:#444;color:#e0dedd}
.dbadge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600;margin-right:3px}
.dbadge-r{background:#FCEBEB;color:#791F1F}
.dbadge-a{background:#FAEEDA;color:#633806}
.dbadge-b{background:#E6F1FB;color:#0C447C}
.dbadge-g{background:#F1EFE8;color:#444}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-icon">🔬</div>
  <h2>안과 진료 어시스턴트</h2>
  <p>비밀번호를 입력하세요</p>
  <input type="password" id="pw-input" placeholder="••••" 
    maxlength="20" autocomplete="off"
    onkeydown="if(event.key==='Enter')checkPw()">
  <button onclick="checkPw()">잠금 해제</button>
  <div class="err" id="pw-err"></div>
  <div class="hint">비밀번호를 잊으셨나요?<br>앱 설정에서 변경 가능합니다</div>
</div>

<div class="app">
<h1>🔬 안과 진료 어시스턴트</h1>
<div class="top-tabs">
  <button class="ttab on"  onclick="goTab('proto',this)">진료 프로토콜</button>
  <button class="ttab"     onclick="goTab('ivi',this)">💉 유리체내 주사</button>
  <button class="ttab"     onclick="goTab('drugs',this)">처방약</button>
  <button class="ttab"     onclick="goTab('special',this)">특수 프로토콜</button>
  <button class="ttab"     onclick="goTab('ins',this)">보험 기준</button>
  <button class="ttab"     onclick="goTab('memo',this)">내 메모</button>
  <button class="ttab"     onclick="goTab('contra',this)">⚠️ 약물 금기</button>
  <button class="ttab" id="fav-tab-btn" onclick="goTab('favtab',this)">★ 즐겨찾기</button>
  <button id="dark-btn" class="ttab" onclick="toggleDark()" style="margin-left:auto">🌙</button>
</div>

<div class="sec on" id="sec-proto">
  <div class="stat-row" id="stat-row"></div>
  <input class="srch" type="text" id="srch" placeholder="질환명 / 분류 검색..." oninput="render()">
  <div class="frow" id="frow"></div>
  <div id="clist"></div>
</div>

<div class="sec" id="sec-ivi">
  <div class="frow" id="ivi-tabs">
    <button class="fb on" onclick="iviTab('drug',this)">약물 비교 (7종)</button>
    <button class="fb"    onclick="iviTab('dx',this)">질환별 치료 전략</button>
    <button class="fb"    onclick="iviTab('ins2',this)">국내 보험 기준</button>
    <button class="fb"    onclick="iviTab('proc',this)">시술 절차 / 주의사항</button>
  </div>
  <div id="ivi-drug"></div>
  <div id="ivi-dx"   style="display:none"></div>
  <div id="ivi-ins2" style="display:none"></div>
  <div id="ivi-proc" style="display:none"></div>
</div>

<div class="sec" id="sec-drugs"></div>
<div class="sec" id="sec-special"></div>
<div class="sec" id="sec-ins"></div>
<div class="sec" id="sec-contra"></div>
<div class="sec" id="sec-favtab"></div>

<div class="sec" id="sec-memo">
  <div style="display:flex;gap:8px;margin-bottom:.75rem">
  <button class="add-btn" style="margin-bottom:0;flex:1" onclick="openMemo()">＋ 메모 추가</button>
  <button class="add-btn" style="margin-bottom:0;color:#888" onclick="changePw()">🔑 비밀번호 변경</button>
</div>
  <div id="mlist"></div>
</div>

<div class="modal-bg" id="mbg">
  <div class="modal">
    <h3>메모 추가</h3>
    <div class="fg"><label>제목</label><input type="text" id="mt" placeholder="제목 입력..."></div>
    <div class="fg"><label>내용</label><textarea id="mb" rows="5" placeholder="내용 입력..."></textarea></div>
    <div class="mfoot">
      <button class="btn-s" onclick="closeModal()">취소</button>
      <button class="btn-p" onclick="saveMemo()">저장</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="pw-change-modal">
  <div class="modal">
    <h3>🔑 비밀번호 변경</h3>
    <div class="fg">
      <label>현재 비밀번호</label>
      <input type="password" id="pw-cur" placeholder="현재 비밀번호" autocomplete="off">
    </div>
    <div class="fg">
      <label>새 비밀번호 (4자 이상)</label>
      <input type="password" id="pw-new" placeholder="새 비밀번호" autocomplete="off">
    </div>
    <div class="fg">
      <label>새 비밀번호 확인</label>
      <input type="password" id="pw-new2" placeholder="새 비밀번호 재입력" autocomplete="off">
    </div>
    <div id="pw-change-err" style="font-size:12px;color:#E24B4A;min-height:18px;margin-bottom:4px"></div>
    <div class="mfoot">
      <button class="btn-s" onclick="document.getElementById('pw-change-modal').classList.remove('on')">취소</button>
      <button class="btn-p" onclick="doChangePw()">변경</button>
    </div>
  </div>
</div>

</div>

<script>
function goTab(id,btn){
  document.querySelectorAll('.ttab:not(#dark-btn)').forEach(b=>b.classList.remove('on'));
  if(btn.id!=='dark-btn')btn.classList.add('on');
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById('sec-'+id).classList.add('on');
  if(id==='drugs')renderDrugs();
  if(id==='special')renderSpecial();
  if(id==='ins')renderIns();
  if(id==='memo')renderMemos();
  if(id==='ivi')renderIVI('drug');
  if(id==='contra')renderContra();
  if(id==='favtab')renderFavTab();
}

function toggleDark(){
  const on=document.body.classList.toggle('dark');
  document.getElementById('dark-btn').textContent=on?'☀️':'🌙';
  try{localStorage.setItem('oph_dark',on?'1':'0');}catch(e){}
}
(function(){
  try{if(localStorage.getItem('oph_dark')==='1'){
    document.body.classList.add('dark');
    const db=document.getElementById('dark-btn');
    if(db) db.textContent='☀️';
  }}catch(e){}
})();

let favs=new Set();
try{const f=localStorage.getItem('oph_favs');if(f)favs=new Set(JSON.parse(f));}catch(e){}
function saveFavs(){try{localStorage.setItem('oph_favs',JSON.stringify([...favs]));}catch(e){}}
function toggleFavIdx(idx,btn){
  const name=D[idx].name;
  if(favs.has(name)){favs.delete(name);btn.classList.remove('on');btn.textContent='☆';}
  else{favs.add(name);btn.classList.add('on');btn.textContent='★';}
  saveFavs();
  if(document.getElementById('sec-favtab')?.classList.contains('on')) renderFavTab();
  buildStat();
}
function goFavTab(){
  const btn=document.getElementById('fav-tab-btn');
  if(btn) goTab('favtab',btn);
}

const cardTabState={};
let iviR={};
function iviTab(sub,btn){
  document.querySelectorAll('#ivi-tabs .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  ['drug','dx','ins2','proc'].forEach(k=>document.getElementById('ivi-'+k).style.display=k===sub?'block':'none');
  renderIVI(sub);
}
function renderIVI(sub){
  if(iviR[sub])return; iviR[sub]=true;
  if(sub==='drug')renderIVIDrug();
  if(sub==='dx')renderIVIDx();
  if(sub==='ins2')renderIVIIns();
  if(sub==='proc')renderIVIProc();
}

function tgDx(i){
  const b=document.getElementById('db_dx'+i),c=document.getElementById('dc'+i);
  const o=b.style.display==='block';
  b.style.display=o?'none':'block';
  if(c)c.textContent=o?'▼':'▲';
}

const cats=[...new Set(D.map(d=>d.cat))];
let actCat='전체';

function goFavTab(){
  const btn=document.getElementById('fav-tab-btn');
  if(btn) goTab('favtab',btn);
}
function buildStat(){
  const fc=favs.size;
  const favChip=fc>0?'<div class="stat-chip" style="cursor:pointer;background:#FAEEDA;color:#633806" onclick="goFavTab()">★ 즐겨찾기 <span style="color:#633806;font-weight:700">'+fc+'개</span></div>':'';
  document.getElementById('stat-row').innerHTML=
    '<div class="stat-chip">총 <span>'+D.length+'개</span> 질환</div>'+
    '<div class="stat-chip">카테고리 <span>'+cats.length+'개</span></div>'+
    '<div class="stat-chip">IVI 약물 <span>'+DRUGS.length+'종</span></div>'+
    favChip;
}
function buildFilters(){
  const catCount={};
  D.forEach(d=>{catCount[d.cat]=(catCount[d.cat]||0)+1;});
  document.getElementById('frow').innerHTML=['전체',...cats].map(c=>{
    const cnt=c==='전체'?D.length:(catCount[c]||0);
    return '<button class="fb'+(c==='전체'?' on':'')+'" onclick="setF(this.dataset.cat,this)" data-cat="'+c+'">'+c+' <span style="font-size:10px;opacity:.7">'+cnt+'</span></button>';
  }).join('');
}
function setF(c,btn){
  actCat=c;
  document.querySelectorAll('#frow .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function swTab(cid,ti){
  cardTabState[cid]=ti;
  for(let j=0;j<5;j++){
    document.getElementById('it'+cid+'_'+j)?.classList.toggle('on',j===ti);
    document.getElementById('pn'+cid+'_'+j)?.classList.toggle('on',j===ti);
  }
}
function toggleCard(id){
  const b=document.getElementById('db_'+id),c=document.getElementById('chev_'+id);
  if(!b)return;
  const open=b.style.display==='block';
  b.style.display=open?'none':'block';
  if(c)c.textContent=open?'▼':'▲';
}
function render(){
  const q=(document.getElementById('srch')||{}).value||'';
  let items=D;
  if(actCat!=='전체') items=items.filter(d=>d.cat===actCat);
  if(q) items=items.filter(d=>
    d.name.toLowerCase().includes(q.toLowerCase())||
    d.cat.includes(q)||
    (d.drugs&&d.drugs.some(dr=>dr.toLowerCase().includes(q.toLowerCase())))
  );
  if(!q) items=[...items].sort((a,b)=>(favs.has(b.name)?1:0)-(favs.has(a.name)?1:0));
  const el=document.getElementById('clist');
  if(!items.length){el.innerHTML='<div class="empty">검색 결과 없음</div>';return;}
  el.innerHTML=items.map(d=>{
    const i=D.indexOf(d);
    const bc=catColor[d.cat]||'gray';
    const fuHtml=d.fu.map(([t,v])=>`<div class="fu-r"><span class="fu-t">${t}</span><span>${v}</span></div>`).join('');
    const kcHtml=`<div class="kc-hd r">놓치면 안 되는 소견</div>${d.kc.r.map(x=>`<div class="li"><div class="dot dot-r"></div><div>${x}</div></div>`).join('')}<div class="kc-hd a">처방/치료 결정 기준</div>${d.kc.a.map(x=>`<div class="li"><div class="dot dot-a"></div><div>${x}</div></div>`).join('')}<div class="kc-hd t">환자 설명 포인트</div>${d.kc.t.map(x=>`<div class="li"><div class="dot dot-t"></div><div>${x}</div></div>`).join('')}`;
    // ROP에만 분류 테이블 추가
    const isROP = d.extraHTML==='rop';
    const slitExtra = isROP ? ropClassTable : '';
    const fuExtra = isROP ? ropFUTable : '';
    return `<div class="dc"><div class="dc-hd" onclick="toggleCard(${i})">
      <div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0">
        <button class="fav-btn ${favs.has(d.name)?'on':''}" onclick="event.stopPropagation();toggleFavIdx(${i},this)" title="즐겨찾기">${favs.has(d.name)?'★':'☆'}</button>
        <span class="dc-title">${d.name}</span>
      </div>
      <div style="display:flex;gap:5px;align-items:center;flex-shrink:0"><span class="bd ${bc}">${d.cat}</span><span id="chev_${i}" style="font-size:10px;color:#888">▼</span></div>
    </div>
    <div id="db_${i}" style="display:none;border-top:1px solid #e0dfd9">
      <div class="itabs">
        <button class="it on" id="it${i}_0" onclick="swTab(${i},0)">슬릿</button>
        <button class="it" id="it${i}_1" onclick="swTab(${i},1)">검사</button>
        <button class="it" id="it${i}_2" onclick="swTab(${i},2)">처방약</button>
        <button class="it" id="it${i}_3" onclick="swTab(${i},3)">추적관찰</button>
        <button class="it" id="it${i}_4" onclick="swTab(${i},4)">★ 핵심체크</button>
      </div>
      <div class="pn on" id="pn${i}_0">${d.slit.map((s,j)=>`<div class="li"><span class="li-n">${j+1}.</span><span>${s}</span></div>`).join('')}${slitExtra}</div>
      <div class="pn" id="pn${i}_1"><div class="pills">${d.exam.map(e=>`<span class="pill">${e}</span>`).join('')}</div></div>
      <div class="pn" id="pn${i}_2">${d.drugs.map(dr=>`<div class="li"><span class="li-n">•</span><span>${dr}</span></div>`).join('')}</div>
      <div class="pn" id="pn${i}_3">${fuExtra}${fuHtml}${d.note?`<div class="hb hb-g" style="margin-top:8px;font-size:11px">📚 ${d.note}</div>`:''}</div>
      <div class="pn" id="pn${i}_4">${kcHtml}</div>
    </div></div>`;
  }).join('');
}

function changePw(){
  // 입력값 초기화
  document.getElementById('pw-cur').value='';
  document.getElementById('pw-new').value='';
  document.getElementById('pw-new2').value='';
  document.getElementById('pw-change-err').textContent='';
  document.getElementById('pw-change-modal').classList.add('on');
}

async function doChangePw(){
  const cur=document.getElementById('pw-cur').value;
  const np=document.getElementById('pw-new').value;
  const np2=document.getElementById('pw-new2').value;
  const err=document.getElementById('pw-change-err');
  
  if(!cur){err.textContent='현재 비밀번호를 입력하세요';return;}
  if(!np||np.length<4){err.textContent='새 비밀번호는 4자 이상이어야 합니다';return;}
  if(np!==np2){err.textContent='새 비밀번호가 일치하지 않습니다';return;}
  
  // 현재 비밀번호 확인
  const buf0=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(cur));
  const hash0=Array.from(new Uint8Array(buf0)).map(b=>b.toString(16).padStart(2,'0')).join('');
  const HASH=localStorage.getItem('oph_pw_hash')||'03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
  
  if(hash0!==HASH){err.textContent='현재 비밀번호가 틀렸습니다';return;}
  
  // 새 비밀번호 저장
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(np));
  const newHash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  localStorage.setItem('oph_pw_hash',newHash);
  
  document.getElementById('pw-change-modal').classList.remove('on');
  err.textContent='';
  
  // 성공 알림 (모달 방식)
  setTimeout(()=>{
    const toast=document.createElement('div');
    toast.style.cssText='position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;';
    toast.textContent='✅ 비밀번호가 변경되었습니다';
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),2500);
  },200);
}

async function checkPw(){
  const input=document.getElementById('pw-input').value;
  const err=document.getElementById('pw-err');
  if(!input){err.textContent='비밀번호를 입력하세요';return;}
  
  // SHA-256 해시
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
  const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  
  // localStorage에 변경된 비밀번호가 있으면 우선 사용
  const HASH=localStorage.getItem('oph_pw_hash')||'03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
  
  if(hash===HASH){
    document.getElementById('lock-screen').style.display='none';
    err.textContent='';
  } else {
    err.textContent='비밀번호가 틀렸습니다';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
    // 진동 피드백 (모바일)
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
  }
}
